<!doctype html>
<html><head><meta charset="utf-8"><title>UIA WEB TEST</title>
<style>body{font:16px sans-serif;padding:24px} input,textarea,div.rich{display:block;margin:12px 0;width:420px;padding:6px;border:1px solid #888} div.rich{min-height:40px}</style>
</head><body>
<h2>UIA web test page</h2>
<input id="name" aria-label="Name field" placeholder="name">
<textarea id="notes" aria-label="Notes field" rows="3"></textarea>
<div id="rich" class="rich" contenteditable="true" role="textbox" aria-label="Rich box"></div>
<button id="go" onclick="S.clicks++;upd()">Go web</button>
<label><input id="agree" type="checkbox"> Agree web</label>
<script>
const S = {clicks:0, inputEv:0, changeEv:0, keyEv:0};
const $ = id => document.getElementById(id);
function upd(){
  document.title = `UIA WEB TEST | clicks=${S.clicks} name=${$('name').value} notes=${$('notes').value.replace(/\n/g,'/')} rich=${$('rich').innerText.replace(/\n/g,'/')} agree=${$('agree').checked} input_ev=${S.inputEv} change_ev=${S.changeEv}`;
}
// A framework like React only notices changes it sees as an 'input' EVENT (it tracks the last value itself)
for (const id of ['name','notes','rich']) {
  $(id).addEventListener('input', () => { S.inputEv++; upd(); });
  $(id).addEventListener('change', () => { S.changeEv++; upd(); });
}
$('agree').addEventListener('change', upd);
upd();
</script></body></html>
